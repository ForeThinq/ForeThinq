<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28">
  <defs>
    <filter id="glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7FC2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FD4FF"/>
      <stop offset="1" stop-color="#2E7FC2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="28" fill="#04070C"/>
  <line x1="0" y1="14" x2="1200" y2="14" stroke="url(#fade)" stroke-width="2"/>
  <circle r="4" cy="14" cx="-20" fill="#BFE8FF" filter="url(#glow)">
    <animate attributeName="cx" values="-20;1220" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" cy="14" cx="-20" fill="#7FD4FF" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cx" values="-20;1220" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
