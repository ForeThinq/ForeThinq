<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07182B"/><stop offset="1" stop-color="#04090F"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FD4FF"/><stop offset="1" stop-color="#38E1FF"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="383" rx="20" fill="url(#bg)" stroke="rgba(127,212,255,0.28)"/>
  <text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#7FD4FF">PROOF OF WORK</text>
  <rect x="40" y="60" width="56" height="3" fill="url(#acc)"/>
  <text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#9DB8CC">Demo systems, built like client work.</text>
  <text x="40" y="138" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#2E7FC2">01</text>
  <text x="104" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF6FF">Inbound Lead Triage</text>
  <text x="104" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">n8n workflow — validates, dedupes, AI-scores and routes enquiries to Sheets + instant email alerts</text>
  <text x="40" y="216" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#2E7FC2">02</text>
  <text x="104" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF6FF">WhatsApp AI Assistant</text>
  <text x="104" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">Salon assistant — answers from its own price list, books, logs chats, escalates anything uncertain</text>
  <text x="40" y="294" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#2E7FC2">03</text>
  <text x="104" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF6FF">AI Data Extraction</text>
  <text x="104" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">Zero-dependency Python tool — messy invoices &amp; order messages in, one clean deduped CSV out</text>
  <text x="40" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7393AB">Repos with full READMEs and walkthrough videos are published here as each demo ships.</text>
