  <rect x="0.5" y="0.5" width="899" height="335" rx="20" fill="url(#bg)" stroke="rgba(127,212,255,0.28)"/>
  <text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#7FD4FF">HOW I WORK</text>
  <rect x="40" y="60" width="56" height="3" fill="url(#acc)"/>
  <text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#9DB8CC">Clear scope. Fixed price. No mystery hours.</text>
  <circle cx="128" cy="140" r="21" fill="rgba(127,212,255,0.06)" stroke="rgba(127,212,255,0.45)"/>
  <text x="128" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#EAF6FF" text-anchor="middle">1</text>
  <text x="128" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#EAF6FF" text-anchor="middle">Audit</text>
  <text x="128" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">We map where leads</text>
  <text x="128" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">or data leak today.</text>
  <circle cx="348" cy="140" r="21" fill="rgba(127,212,255,0.06)" stroke="rgba(127,212,255,0.45)"/>
  <text x="348" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#EAF6FF" text-anchor="middle">2</text>
  <text x="348" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#EAF6FF" text-anchor="middle">Scope</text>
  <text x="348" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">Fixed price agreed</text>
  <text x="348" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">before any build starts.</text>
  <circle cx="568" cy="140" r="21" fill="rgba(127,212,255,0.06)" stroke="rgba(127,212,255,0.45)"/>
  <text x="568" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#EAF6FF" text-anchor="middle">3</text>
  <text x="568" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#EAF6FF" text-anchor="middle">Build</text>
  <text x="568" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">Built inside your own</text>
  <text x="568" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">accounts and tools.</text>
  <circle cx="788" cy="140" r="21" fill="rgba(127,212,255,0.06)" stroke="rgba(127,212,255,0.45)"/>
  <text x="788" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#EAF6FF" text-anchor="middle">4</text>
  <text x="788" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#EAF6FF" text-anchor="middle">Handover</text>
  <text x="788" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">Alerts, docs, walkthrough</text>
  <text x="788" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9DB8CC" text-anchor="middle">and fix support included.</text>
  <line x1="40" y1="266" x2="860" y2="266" stroke="rgba(127,212,255,0.15)"/>
  <path d="M40 302 l3.5 3.5 L51 296.5" fill="none" stroke="#38E1FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">Your data stays yours</text>
  <path d="M330 302 l3.5 3.5 L341 296.5" fill="none" stroke="#38E1FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">Error alerts on every build</text>
  <path d="M660 302 l3.5 3.5 L671 296.5" fill="none" stroke="#38E1FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9DB8CC">Wise / UPI payments</text>
